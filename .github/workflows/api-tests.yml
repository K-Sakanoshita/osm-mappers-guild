name: PHP API smoke tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'db/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP SQLite support
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring
      - name: Validate syntax
        run: |
          php -l api/index.php
          node --check frontend/app.js
          node tests/social_ui_test.cjs
          node tests/social_draft_test.cjs
          node tests/mypage_test.cjs
          node tests/changeset_picker_test.cjs
          node tests/request_map_test.cjs
          python3 tests/likes_migration_test.py
      - name: Run PHP API smoke tests
        run: bash tests/run_smoke_test.sh
